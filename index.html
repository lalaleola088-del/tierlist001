<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내남팸의 티어리스트!</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --panel-bg: rgba(22, 28, 45, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-glow: #6366f1;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Noto Sans KR', sans-serif;
            min-height: 100vh;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 1100px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .main-title {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            margin-bottom: 20px;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
            background: var(--panel-bg);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-sub);
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .tab-content {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tab-content.active {
            display: block;
            opacity: 1;
        }

        .panel-box {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
        }

        .panel-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tier-board {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--panel-border);
        }

        .tier-row {
            display: flex;
            min-height: 70px;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid var(--panel-border);
        }

        .tier-label {
            width: 105px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            font-weight: 800;
            font-size: 0.8rem;
            flex-shrink: 0;
            padding: 6px;
            gap: 4px;
            text-align: center;
        }

        .tier-icon-badge {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tier-icon-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 알파벳 티어 스타일 */
        .tier-S { background: linear-gradient(135deg, #ff4757, #ff6b81); color: #fff; font-size: 1.5rem; }
        .tier-Ap { background: linear-gradient(135deg, #ff6b81, #ff7f50); color: #fff; font-size: 1.4rem; }
        .tier-A { background: linear-gradient(135deg, #ff7f50, #ffa502); color: #fff; font-size: 1.4rem; }
        .tier-Bp { background: linear-gradient(135deg, #ffa502, #eccc68); color: #1e293b; font-size: 1.4rem; }
        .tier-B { background: linear-gradient(135deg, #eccc68, #f1c40f); color: #1e293b; font-size: 1.4rem; }
        .tier-Bm { background: linear-gradient(135deg, #f1c40f, #2ed573); color: #1e293b; font-size: 1.4rem; }
        .tier-C { background: linear-gradient(135deg, #2ed573, #7bed9f); color: #1e293b; font-size: 1.4rem; }
        .tier-D { background: linear-gradient(135deg, #1e90ff, #70a1ff); color: #fff; font-size: 1.4rem; }
        .tier-E { background: linear-gradient(135deg, #a55eea, #d6a2e8); color: #fff; font-size: 1.4rem; }

        /* 오버워치 티어 디자인 배지 */
        .tier-top500 { background: rgba(239, 68, 68, 0.15); border-right: 3px solid #ef4444; color: #fca5a5; }
        .tier-champion { background: rgba(168, 85, 247, 0.15); border-right: 3px solid #a855f7; color: #d8b4fe; }
        .tier-grandmaster { background: rgba(236, 72, 153, 0.15); border-right: 3px solid #ec4899; color: #fbcfe8; }
        .tier-master { background: rgba(192, 132, 252, 0.15); border-right: 3px solid #c084fc; color: #e9d5ff; }
        .tier-diamond { background: rgba(96, 165, 250, 0.15); border-right: 3px solid #60a5fa; color: #bfdbfe; }
        .tier-emerald { background: rgba(52, 211, 153, 0.15); border-right: 3px solid #34d399; color: #a7f3d0; }
        .tier-platinum { background: rgba(45, 212, 191, 0.15); border-right: 3px solid #2dd4bf; color: #99f6e4; }
        .tier-gold { background: rgba(250, 204, 21, 0.15); border-right: 3px solid #facc15; color: #fef08a; }
        .tier-silver { background: rgba(203, 213, 225, 0.15); border-right: 3px solid #cbd5e1; color: #f1f5f9; }
        .tier-bronze { background: rgba(251, 146, 60, 0.15); border-right: 3px solid #fb923c; color: #fed7aa; }

        .tier-dropzone, .pool-zone {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 10px;
            min-height: 70px;
        }

        .pool-zone {
            background: rgba(10, 14, 23, 0.5);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            min-height: 80px;
        }

        .card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card:active {
            transform: scale(0.95);
        }

        .custom-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        .custom-table th {
            color: var(--text-sub);
            font-size: 0.85rem;
            padding: 10px;
            text-align: left;
        }

        .custom-table td {
            background: rgba(15, 23, 42, 0.6);
            border-top: 1px solid var(--panel-border);
            border-bottom: 1px solid var(--panel-border);
            padding: 12px;
        }

        .custom-table tr td:first-child {
            border-left: 1px solid var(--panel-border);
            border-radius: 10px 0 0 10px;
            font-weight: 700;
            width: 110px;
        }

        .custom-table tr td:last-child {
            border-right: 1px solid var(--panel-border);
            border-radius: 0 10px 10px 0;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid var(--panel-border);
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
        }

        .open-issue-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .open-issue-btn:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
        }

        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
        }

        .badge-low { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
        .badge-mid { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
        .badge-high { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

        .edpi-val {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            color: #a5b4fc;
        }

        /* 모달 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #1e293b;
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }

        .modal-title {
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: #a5b4fc;
        }

        .modal-btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
            max-height: 280px;
            overflow-y: auto;
        }

        .modal-btn {
            padding: 10px 5px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .modal-close-btn {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            color: #ccc;
            font-weight: 700;
            cursor: pointer;
        }

        .issue-modal-box {
            background: #1e293b;
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .issue-textarea {
            width: 100%;
            height: 280px;
            background: rgba(10, 14, 23, 0.85);
            border: 1px solid var(--panel-border);
            color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            line-height: 1.6;
            outline: none;
            resize: vertical;
            font-family: inherit;
            margin-bottom: 15px;
        }

        .status-bar {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8rem;
            color: #22c55e;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1 class="main-title">내남팸의 티어리스트!</h1>
            <nav class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab(this, 'skill')"><i class="fa-solid fa-trophy"></i> 실력</button>
                <button class="tab-btn" onclick="switchTab(this, 'aim')"><i class="fa-solid fa-crosshair"></i> 에임</button>
                <button class="tab-btn" onclick="switchTab(this, 'sense')"><i class="fa-solid fa-brain"></i> 센스</button>
                <button class="tab-btn" onclick="switchTab(this, 'owcurr')"><i class="fa-solid fa-user-check"></i> 현재 티어</button>
                <button class="tab-btn" onclick="switchTab(this, 'owexp')"><i class="fa-solid fa-wand-magic-sparkles"></i> 잠재적 티어</button>
                <button class="tab-btn" onclick="switchTab(this, 'issues')"><i class="fa-solid fa-triangle-exclamation"></i> 문제점</button>
                <button class="tab-btn" onclick="switchTab(this, 'sens')"><i class="fa-solid fa-sliders"></i> 감도</button>
            </nav>
        </header>

        <section id="tab-skill" class="tab-content active">
            <div class="panel-box">
                <h2 class="panel-title"><i class="fa-solid fa-trophy" style="color: #f59e0b;"></i> 실력 티어리스트</h2>
                <div class="tier-board" id="board-skill"></div>
                <div class="panel-title" style="font-size: 1rem; margin-top: 15px;">대기목록</div>
                <div class="pool-zone" id="skill-pool" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            </div>
        </section>

        <section id="tab-aim" class="tab-content">
            <div class="panel-box">
                <h2 class="panel-title"><i class="fa-solid fa-crosshair" style="color: #ef4444;"></i> 에임 티어리스트</h2>
                <div class="tier-board" id="board-aim"></div>
                <div class="panel-title" style="font-size: 1rem; margin-top: 15px;">대기목록</div>
                <div class="pool-zone" id="aim-pool" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            </div>
        </section>

        <section id="tab-sense" class="tab-content">
            <div class="panel-box">
                <h2 class="panel-title"><i class="fa-solid fa-brain" style="color: #a855f7;"></i> 센스 티어리스트</h2>
                <div class="tier-board" id="board-sense"></div>
                <div class="panel-title" style="font-size: 1rem; margin-top: 15px;">대기목록</div>
                <div class="pool-zone" id="sense-pool" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            </div>
        </section>

        <!-- 현재 티어 탭 -->
        <section id="tab-owcurr" class="tab-content">
            <div class="panel-box">
                <h2 class="panel-title"><i class="fa-solid fa-user-check" style="color: #38bdf8;"></i> 현재 티어</h2>
                <div class="tier-board" id="board-owcurr"></div>
                <div class="panel-title" style="font-size: 1rem; margin-top: 15px;">대기목록</div>
                <div class="pool-zone" id="owcurr-pool" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            </div>
        </section>

        <!-- 잠재적 티어 탭 -->
        <section id="tab-owexp" class="tab-content">
            <div class="panel-box">
                <h2 class="panel-title"><i class="fa-solid fa-wand-magic-sparkles" style="color: #c084fc;"></i> 잠재적 티어</h2>
                <div class="tier-board" id="board-owexp"></div>
                <div class="panel-title" style="font-size: 1rem; margin-top: 15px;">대기목록</div>
                <div class="pool-zone" id="owexp-pool" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            </div>
        </section>

        <section id="tab-issues" class="tab-content">
            <div class="panel-box">
                <h2 class="panel-title"><i class="fa-solid fa-triangle-exclamation" style="color: #eab308;"></i> 멤버별 문제점 분석</h2>
                <table class="custom-table">
                    <thead>
                        <tr><th>이름</th><th>문제점 메모 관리</th></tr>
                    </thead>
                    <tbody id="issue-tbody"></tbody>
                </table>
            </div>
        </section>

        <section id="tab-sens" class="tab-content">
            <div class="panel-box">
                <h2 class="panel-title"><i class="fa-solid fa-sliders" style="color: #3b82f6;"></i> 인게임 감도 & DPI 계산기</h2>
                <table class="custom-table">
                    <thead>
                        <tr><th>이름</th><th>인게임 감도</th><th>DPI</th><th>EDPI</th><th>감도 분류</th></tr>
                    </thead>
                    <tbody id="sens-tbody"></tbody>
                </table>
            </div>
        </section>

        <div class="status-bar" id="status-text">● 모든 유저 실시간 데이터 연동 활성화됨</div>
    </div>

    <!-- 이동 팝업 모달 -->
    <div class="modal-overlay" id="move-modal">
        <div class="modal-box">
            <div class="modal-title" id="modal-card-name">멤버 이동</div>
            <div class="modal-btn-grid"></div>
            <button class="modal-btn" style="background:#334155; width:100%; margin-bottom:8px;" onclick="moveCardTo('pool')">대기목록으로 이동</button>
            <button class="modal-close-btn" onclick="closeModal()">취소</button>
        </div>
    </div>

    <!-- 문제점 작성 모달 -->
    <div class="modal-overlay" id="issue-modal">
        <div class="issue-modal-box">
            <div class="modal-title" id="issue-modal-title" style="font-size: 1.3rem; text-align: left;">멤버 문제점 작성</div>
            <textarea id="issue-modal-textarea" class="issue-textarea" placeholder="여기에 문제점 분석 내용을 자세히 적으세요..." oninput="updateCurrentIssue()"></textarea>
            <button class="modal-close-btn" style="background: linear-gradient(135deg, #6366f1, #4f46e5); color: white;" onclick="closeIssueModal()">닫기 (자동 저장됨)</button>
        </div>
    </div>

    <script>
        const members = ['기강현', '이지호', '정수안', '이원석', '박준혁', '최규진'];
        const categories = [{ id: 'skill' }, { id: 'aim' }, { id: 'sense' }, { id: 'owcurr' }, { id: 'owexp' }];
        const tiers = ['S', 'Ap', 'A', 'Bp', 'B', 'Bm', 'C', 'D', 'E'];

        // jpg 확장자로 적용된 경로
        const overwatchInfo = {
            top500: { name: '상위 500위', img: './top500.jpg' },
            champion: { name: '챔피언', img: './champion.jpg' },
            grandmaster: { name: '그랜드마스터', img: './grand master.jpg' },
            master: { name: '마스터', img: './master.jpg' },
            diamond: { name: '다이아몬드', img: './diamond.jpg' },
            emerald: { name: '에메랄드', img: './emerald.jpg' },
            platinum: { name: '플래티넘', img: './peral.jpg' },
            gold: { name: '골드', img: './gold.jpg' },
            silver: { name: '실버', img: './silver.jpg' },
            bronze: { name: '브론즈', img: './bronze.jpg' }
        };
        const overwatchTiers = Object.keys(overwatchInfo);

        let activeCardId = null;
        let currentIssueMember = null;
        let issuesCache = {};

        // Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyDOzYHRXJP-n_OBlbKJcXK2Z2fEA_nhFbI",
            authDomain: "tirelist-4be0f.firebaseapp.com",
            databaseURL: "https://tirelist-4be0f-default-rtdb.firebaseio.com",
            projectId: "tirelist-4be0f",
            storageBucket: "tirelist-4be0f.firebasestorage.app",
            messagingSenderId: "656391585746",
            appId: "1:656391585746:web:7d33f18842fbce8265920b",
            measurementId: "G-J6JF8WCEKY"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // DOM 생성
        categories.forEach(cat => {
            const boardEl = document.getElementById(`board-${cat.id}`);
            const poolEl = document.getElementById(`${cat.id}-pool`);
            const isOw = cat.id === 'owcurr' || cat.id === 'owexp';
            const currentTiers = isOw ? overwatchTiers : tiers;

            currentTiers.forEach(t => {
                let labelHtml = '';
                if (isOw) {
                    const info = overwatchInfo[t];
                    labelHtml = `
                        <div class="tier-icon-badge">
                            <img src="${info.img}" alt="${info.name}">
                        </div>
                        <span>${info.name}</span>
                    `;
                } else {
                    labelHtml = t.replace('p', '+').replace('m', '-');
                }

                boardEl.innerHTML += `
                    <div class="tier-row">
                        <div class="tier-label tier-${t}">${labelHtml}</div>
                        <div class="tier-dropzone" id="${cat.id}-${t}" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                    </div>
                `;
            });

            members.forEach(m => {
                poolEl.innerHTML += `
                    <div class="card" id="${cat.id}-card-${m}" draggable="true" ondragstart="drag(event)" onclick="openModal('${cat.id}-card-${m}', '${m}')">
                        <i class="fa-solid fa-user"></i> ${m}
                    </div>
                `;
            });
        });

        const issueTbody = document.getElementById('issue-tbody');
        const sensTbody = document.getElementById('sens-tbody');

        members.forEach(m => {
            issueTbody.innerHTML += `
                <tr>
                    <td>${m}</td>
                    <td>
                        <button class="open-issue-btn" onclick="openIssueModal('${m}')">
                            <i class="fa-solid fa-pen-to-square"></i> ${m} 문제점 작성 / 보기
                        </button>
                    </td>
                </tr>
            `;
            sensTbody.innerHTML += `
                <tr>
                    <td>${m}</td>
                    <td><input type="number" step="any" id="ingame-${m}" placeholder="1.2" oninput="saveData()"></td>
                    <td><input type="number" id="dpi-${m}" placeholder="800" oninput="saveData()"></td>
                    <td><span class="edpi-val" id="edpi-${m}">0</span></td>
                    <td id="sens-type-${m}">-</td>
                </tr>
            `;
        });

        // 탭 전환
        function switchTab(btnElement, tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            btnElement.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        // 드래그 앤 드롭
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drop(ev) {
            ev.preventDefault();
            const targetZone = ev.target.closest('.tier-dropzone') || ev.target.closest('.pool-zone');
            if (targetZone) {
                const cardId = ev.dataTransfer.getData("text");
                const cardEl = document.getElementById(cardId);
                if (cardEl) {
                    targetZone.appendChild(cardEl);
                    saveData();
                }
            }
        }

        // 클릭 이동 모달
        function openModal(cardId, name) {
            activeCardId = cardId;
            const categoryId = cardId.split('-')[0];
            document.getElementById('modal-card-name').innerText = `${name} 위치 이동`;

            const modalBtnGrid = document.querySelector('#move-modal .modal-btn-grid');
            modalBtnGrid.innerHTML = '';

            const isOw = categoryId === 'owcurr' || categoryId === 'owexp';
            const currentTiers = isOw ? overwatchTiers : tiers;

            currentTiers.forEach(t => {
                const labelText = isOw ? overwatchInfo[t].name : t.replace('p', '+').replace('m', '-');
                modalBtnGrid.innerHTML += `<button class="modal-btn tier-${t}" onclick="moveCardTo('${t}')">${labelText}</button>`;
            });

            document.getElementById('move-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('move-modal').classList.remove('active');
            activeCardId = null;
        }

        function moveCardTo(targetTier) {
            if (!activeCardId) return;
            const cardEl = document.getElementById(activeCardId);
            const categoryId = activeCardId.split('-')[0];
            const targetZoneId = (targetTier === 'pool') ? `${categoryId}-pool` : `${categoryId}-${targetTier}`;
            const targetZone = document.getElementById(targetZoneId);
            if (cardEl && targetZone) {
                targetZone.appendChild(cardEl);
                saveData();
            }
            closeModal();
        }

        // 문제점 모달
        function openIssueModal(memberName) {
            currentIssueMember = memberName;
            document.getElementById('issue-modal-title').innerText = `⚠️ ${memberName} 멤버 문제점 작성`;
            document.getElementById('issue-modal-textarea').value = issuesCache[memberName] || '';
            document.getElementById('issue-modal').classList.add('active');
        }

        function closeIssueModal() {
            document.getElementById('issue-modal').classList.remove('active');
            currentIssueMember = null;
        }

        function updateCurrentIssue() {
            if (!currentIssueMember) return;
            const textVal = document.getElementById('issue-modal-textarea').value;
            issuesCache[currentIssueMember] = textVal;
            saveData();
        }

        // EDPI 계산
        function calcSens(name) {
            const ingame = parseFloat(document.getElementById(`ingame-${name}`).value) || 0;
            const dpi = parseFloat(document.getElementById(`dpi-${name}`).value) || 0;
            const edpi = Math.round(ingame * dpi * 100) / 100;
            document.getElementById(`edpi-${name}`).innerText = edpi.toLocaleString();
            const typeEl = document.getElementById(`sens-type-${name}`);
            if (edpi > 0) {
                if (edpi <= 4000) typeEl.innerHTML = '<span class="badge badge-low">저감도</span>';
                else if (edpi >= 7000) typeEl.innerHTML = '<span class="badge badge-high">고감도</span>';
                else typeEl.innerHTML = '<span class="badge badge-mid">중감도</span>';
            } else {
                typeEl.innerText = '-';
            }
        }

        // 저장 함수
        function saveData() {
            const state = { tiers: {}, issues: issuesCache, sens: {} };

            categories.forEach(cat => {
                state.tiers[cat.id] = {};
                const isOw = cat.id === 'owcurr' || cat.id === 'owexp';
                const currentTiers = isOw ? overwatchTiers : tiers;

                currentTiers.concat(['pool']).forEach(zone => {
                    const zoneId = (zone === 'pool') ? `${cat.id}-pool` : `${cat.id}-${zone}`;
                    const zoneEl = document.getElementById(zoneId);
                    if (zoneEl) state.tiers[cat.id][zone] = Array.from(zoneEl.children).map(c => c.id);
                });
            });

            members.forEach(m => {
                const ingameVal = document.getElementById(`ingame-${m}`).value;
                const dpiVal = document.getElementById(`dpi-${m}`).value;
                state.sens[m] = { ingame: ingameVal, dpi: dpiVal };
                calcSens(m);
            });

            db.ref('naenamfam_tier_data').set(state);
        }

        // 실시간 연동
        db.ref('naenamfam_tier_data').on('value', snapshot => {
            const data = snapshot.val();
            if (!data) return;

            if (data.tiers) {
                Object.keys(data.tiers).forEach(catId => {
                    Object.keys(data.tiers[catId]).forEach(zone => {
                        const zoneId = (zone === 'pool') ? `${catId}-pool` : `${catId}-${zone}`;
                        const zoneEl = document.getElementById(zoneId);
                        if (zoneEl && data.tiers[catId][zone]) {
                            data.tiers[catId][zone].forEach(cardId => {
                                const card = document.getElementById(cardId);
                                if (card) zoneEl.appendChild(card);
                            });
                        }
                    });
                });
            }

            if (data.issues) {
                issuesCache = data.issues;
                if (currentIssueMember && document.activeElement !== document.getElementById('issue-modal-textarea')) {
                    document.getElementById('issue-modal-textarea').value = issuesCache[currentIssueMember] || '';
                }
            }

            if (data.sens) {
                Object.keys(data.sens).forEach(m => {
                    const ingameEl = document.getElementById(`ingame-${m}`);
                    const dpiEl = document.getElementById(`dpi-${m}`);
                    if (ingameEl && document.activeElement !== ingameEl) ingameEl.value = data.sens[m].ingame || '';
                    if (dpiEl && document.activeElement !== dpiEl) dpiEl.value = data.sens[m].dpi || '';
                    calcSens(m);
                });
            }
        });
    </script>
</body>
</html>
